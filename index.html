<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>

  <!-- Google Fonts (works online; the app still looks fine offline thanks to fallback fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Our own stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <!-- Top banner: date, theme switch, title and progress -->
    <header class="hero">
      <div class="hero__top">
        <p class="hero__date" id="todayDate"></p>

        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark theme">
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>

      <h1 class="hero__title">Today's tasks</h1>

      <div class="progress">
        <div class="progress__track" role="progressbar" aria-label="Completed tasks"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
          <span class="progress__fill" id="progressFill"></span>
        </div>
        <p class="progress__text" id="progressText">Nothing planned yet</p>
      </div>
    </header>

    <!-- Main card: add form, filters and the list -->
    <section class="panel" aria-label="Your tasks">

      <!-- CREATE -->
      <form class="add-form" id="taskForm" novalidate>
        <label class="sr-only" for="taskInput">New task</label>
        <div class="add-form__row">
          <input type="text" id="taskInput" class="add-form__input" maxlength="120"
                 placeholder="What needs to get done?" autocomplete="off">
          <button type="submit" class="btn-add">Add task</button>
        </div>

        <fieldset class="priority">
          <legend class="priority__legend">Priority</legend>

          <label class="priority__option">
            <input type="radio" name="priority" value="low">
            <span class="priority__pill priority__pill--low">Low</span>
          </label>

          <label class="priority__option">
            <input type="radio" name="priority" value="medium" checked>
            <span class="priority__pill priority__pill--medium">Medium</span>
          </label>

          <label class="priority__option">
            <input type="radio" name="priority" value="high">
            <span class="priority__pill priority__pill--high">High</span>
          </label>
        </fieldset>

        <p class="form-error" id="formError" role="alert"></p>
      </form>

      <!-- Filter buttons -->
      <nav class="filters" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All <span class="count">0</span></button>
        <button type="button" data-filter="active" aria-pressed="false">Active <span class="count">0</span></button>
        <button type="button" data-filter="done" aria-pressed="false">Done <span class="count">0</span></button>
      </nav>

      <!-- READ: tasks are drawn here by script.js -->
      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <!-- Shown when there is nothing to display -->
      <div class="empty" id="emptyState" hidden>
        <p class="empty__title" id="emptyTitle"></p>
        <p class="empty__text" id="emptyText"></p>
      </div>

      <footer class="panel__foot">
        <span id="leftCount">0 tasks left</span>
        <button type="button" class="link-btn" id="clearDone" disabled>Clear completed</button>
      </footer>
    </section>

  </main>

  <!-- Our own JavaScript (defer = run after the page is ready) -->
  <script src="script.js" defer></script>
</body>
</html>
